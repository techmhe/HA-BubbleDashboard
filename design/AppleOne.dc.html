<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A3 Apple Home Eine Seite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0d14}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #ffffff; background-color: #0a0d14; background-image: radial-gradient(120% 50% at 100% 0%, rgba(96,116,170,0.6), transparent 60%), radial-gradient(90% 45% at 0% 40%, rgba(36,86,96,0.5), transparent 60%), radial-gradient(110% 55% at 80% 100%, rgba(170,104,74,0.4), transparent 62%); padding: 20px 14px 32px; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; justify-content: space-between; align-items: flex-start; padding: 0 4px">
<div>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Zuhause</h1>
<div style="font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 2px">Sa, 24. Okt · Müll Mi: Grün &amp; Rest</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1); font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4H7M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg>9°
</div>
</header>

<!-- Climate matrix -->
<section aria-labelledby="clim-h" style="border-radius: 22px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 12px 14px">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px">
<h2 id="clim-h" style="margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #ff9f0a; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2a1600" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg></span>Raumklima</h2>
<span style="font-size: 12px; color: rgba(255,255,255,0.72)">Außen 10,5° · TP 7,2°</span>
</div>
<sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin: 8px 0 2px">{{f.name}}</div>
<sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="4">
<a href="AppleRoom.dc.html" style="display: grid; grid-template-columns: 26px minmax(0, 1fr) 40px 52px 48px; align-items: center; gap: 8px; height: 38px; border-top: 1px solid rgba(255,255,255,0.07)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="display: flex; gap: 3px; justify-content: flex-end">
<sc-for list="{{r.dots}}" as="d" hint-placeholder-count="1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{d.c}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></sc-for>
</span>
<span style="{{r.humStyle}}">{{r.hum}} %</span>
<span style="font-size: 16px; font-weight: 700; text-align: right">{{r.temp}}°</span>
</a>
</sc-for>
</sc-for>
<div style="display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.72)">
<span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffb340" stroke-width="2.6" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z"></path></svg>heizt</span>
<span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"></path></svg>jetzt lüften (15 min)</span>
</div>
</section>

<!-- Active devices -->
<section aria-labelledby="on-h" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="on-h" style="margin: 2px 4px 0; font-size: 16px; font-weight: 700">Gerade an <span style="font-weight: 500; color: rgba(255,255,255,0.72)">· 6</span></h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{on}}" as="o" hint-placeholder-count="6">
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px; border-radius: 16px; border: none; background: rgba(242,242,247,0.94); color: #111; text-align: left">
<span style="{{o.circle}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d3000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
<span style="min-width: 0"><span style="display: block; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.name}}</span><span style="display: block; font-size: 11px; color: #555">{{o.room}}</span></span>
</button>
</sc-for>
</div>
</section>

<!-- Energy -->
<section aria-label="Energie" style="border-radius: 22px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1); padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{energy}}" as="e" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.75)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{e.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.icon}}"></path></svg>{{e.name}}</span>
<span style="font-size: 20px; font-weight: 700">{{e.value}}</span>
<span style="font-size: 11px; color: rgba(255,255,255,0.65)">{{e.sub}}</span>
</div>
</sc-for>
</section>

<!-- Below fold -->
<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 28px">
<sc-for list="{{more}}" as="m" hint-placeholder-count="3">
<a href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{m.c}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
<span><span style="display: block; font-size: 13px; font-weight: 700">{{m.name}}</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">{{m.state}}</span></span>
</a>
</sc-for>
</section>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1); font-size: 13px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4M12 10c0-4 1-7 4-7 2 0 3 2 2 4l-4 3M14 12c4 0 7 1 7 4 0 2-2 3-4 2l-3-4M12 14c0 4-1 7-4 7-2 0-3-2-2-4l4-3M10 12c-4 0-7-1-7-4 0-2 2-3 4-2l3 4"></path></svg>
<span><strong>Luftqualität gut</strong> · PM2.5 1 µg/m³ · 5 Luftreiniger an</span>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: -22px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      flame: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z',
      wind: 'M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8',
      bulb: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z',
      tv: 'M3 6h18v12H3zM8 21h8',
      sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      battery: 'M3 8h15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM21 11v2M5 11v2',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
      vacuum: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01',
      desk: 'M4 5h16v10H4zM9 19h6M12 15v4',
      bath: 'M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0',
      bed: 'M3 18V7M3 13h18v5M7 13v-3h5v3',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      pot: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h2M20 10h2M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2'
    };
    var heat = { icon: I.flame, c: '#ffb340' };
    var vent = { icon: I.wind, c: '#8fd8ff' };
    var r = function (name, icon, temp, hum, dots) {
      return { name: name, icon: icon, temp: temp, hum: hum, dots: dots,
        humStyle: hum >= 60 ? 'font-size: 13px; font-weight: 700; color: #8fd8ff; text-align: right' : 'font-size: 13px; color: rgba(255,255,255,0.72); text-align: right' };
    };
    var c = function (bg) { return 'flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: ' + bg; };
    return {
      floors: [
        { name: 'Obergeschoss', rooms: [
          r('Büro Anna', I.desk, '19,0', 62, [heat, vent]),
          r('Büro Max', I.desk, '19,2', 57, []),
          r('Badezimmer', I.bath, '19,1', 61, [vent]),
          r('Schlafzimmer', I.bed, '19,1', 58, [heat]),
          r('Flur 1.OG', I.door, '19,5', 59, [])
        ] },
        { name: 'Erdgeschoss', rooms: [
          r('Wohnzimmer', I.sofa, '19,9', 60, [heat]),
          r('Küche & Esszimmer', I.pot, '19,5', 58, []),
          r('Flur EG', I.door, '18,9', 58, [heat])
        ] }
      ],
      on: [
        { name: 'Stehlampe', room: 'Wohnzimmer', icon: I.bulb, circle: c('#ffd60a') },
        { name: 'Sideboard', room: 'Wohnzimmer', icon: I.bulb, circle: c('#ffd60a') },
        { name: 'Couch', room: 'Wohnzimmer', icon: I.bulb, circle: c('#ffd60a') },
        { name: 'Vase', room: 'Wohnzimmer', icon: I.bulb, circle: c('#ffd60a') },
        { name: 'Heimkino', room: '18 W', icon: I.tv, circle: c('#64d2ff') },
        { name: 'Uhr', room: 'Flur EG', icon: I.bulb, circle: c('#ffd60a') }
      ],
      energy: [
        { name: 'PV', value: '0 W', sub: 'Abend', icon: I.sun, c: '#ffd60a' },
        { name: 'Akku', value: '25 %', sub: '0,52 kWh · −16 W', icon: I.battery, c: '#30d158' },
        { name: 'Verbrauch', value: '92 W', sub: 'gemessene Steckdosen', icon: I.bolt, c: '#ff9f0a' }
      ],
      more: [
        { name: 'Alarm', state: 'Unscharf', icon: I.shield, c: '#64d2ff' },
        { name: 'Haustür', state: 'Keine Person', icon: I.door, c: '#ffffff' },
        { name: 'Robby', state: 'Angedockt', icon: I.vacuum, c: '#ffffff' }
      ]
    };
  }
}
</script>
</body>
</html>
