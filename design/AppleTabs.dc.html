<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A2 Apple Home Tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0d14}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #ffffff; background-color: #0a0d14; background-image: radial-gradient(120% 55% at 0% 0%, rgba(170,104,74,0.5), transparent 60%), radial-gradient(90% 45% at 100% 30%, rgba(96,116,170,0.45), transparent 60%), radial-gradient(110% 55% at 40% 100%, rgba(36,86,96,0.55), transparent 62%); padding: 20px 14px 32px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Klima</h1>
<button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 6px; border-radius: 18px; border: none; background: rgba(255,159,10,0.9); color: #2a1600; font-size: 13px; font-weight: 700">
<span style="width: 26px; height: 26px; border-radius: 13px; background: rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2a1600" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z"></path></svg></span>Heizung an
</button>
</header>

<!-- Tabs -->
<nav aria-label="Bereiche" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 18px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="#" style="{{t.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 11px; font-weight: 600">{{t.name}}</span>
</a>
</sc-for>
</nav>

<!-- Outdoor + vent -->
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="padding: 10px 12px; border-radius: 16px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1)">
<div style="font-size: 11px; color: rgba(255,255,255,0.72)">Außen</div>
<div style="font-size: 15px; font-weight: 700; margin-top: 2px">10,5° · 80 %</div>
<div style="font-size: 11px; color: rgba(255,255,255,0.72)">Taupunkt 7,2°</div>
</div>
<div style="padding: 10px 12px; border-radius: 16px; background: rgba(90,200,250,0.18); border: 1px solid rgba(90,200,250,0.4)">
<div style="font-size: 11px; color: #bfe8ff">Lüften lohnt sich</div>
<div style="font-size: 15px; font-weight: 700; margin-top: 2px">Stoßlüften 15 min</div>
<div style="font-size: 11px; color: #bfe8ff">2 Räume über 60 %</div>
</div>
</div>

<!-- Room list -->
<sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 2px 6px 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.75)">{{f.name}}</h2>
<div style="border-radius: 20px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); overflow: hidden">
<sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="3">
<a href="AppleRoom.dc.html" style="{{r.row}}">
<span style="{{r.circle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 600">{{r.name}}</span>
<span style="display: flex; gap: 6px; font-size: 12px; margin-top: 2px"><span style="color: rgba(255,255,255,0.72)">{{r.hum}} %</span><span style="{{r.tagStyle}}">{{r.tag}}</span></span>
</span>
<span style="text-align: right">
<span style="display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">{{r.temp}}°</span>
<span style="display: block; font-size: 11px; color: rgba(255,255,255,0.72)">→ {{r.target}}°</span>
</span>
<span aria-hidden="true" style="color: rgba(255,255,255,0.4); font-size: 18px; margin-left: 4px">›</span>
</a>
</sc-for>
</div>
</section>
</sc-for>

<!-- Below fold -->
<section style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px">
<h2 style="margin: 2px 6px 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.75)">Alle Räume</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); background: rgba(40,44,56,0.6); color: #fff">
<span style="{{p.circle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
<span style="font-size: 12px; font-weight: 600">{{p.name}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: rgba(40,44,56,0.6); border: 1px solid rgba(255,255,255,0.1)">
<span style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6 4 18"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Klimaanlage OG</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">Aus · innen 20,5°</span></span>
<span style="font-size: 13px; color: rgba(255,255,255,0.72)">24°</span>
</div>
</section>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: -22px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      bulb: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      vacuum: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5',
      flame: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z',
      leaf: 'M5 19c8 0 14-6 14-14-8 0-14 6-14 14zM5 19l7-7',
      snow: 'M12 2v20M4 6l16 12M20 6 4 18',
      desk: 'M4 5h16v10H4zM9 19h6M12 15v4',
      bath: 'M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0',
      bed: 'M3 18V7M3 13h18v5M7 13v-3h5v3',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      pot: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h2M20 10h2M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2'
    };
    var circle = function (bg) { return 'flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: ' + bg; };
    var tab = function (name, icon, active) {
      return { name: name, icon: icon, stroke: active ? '#111' : 'rgba(255,255,255,0.8)',
        style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 52px; border-radius: 14px; ' + (active ? 'background: rgba(242,242,247,0.94); color: #111' : 'color: rgba(255,255,255,0.85)') };
    };
    var row = function (r, last) {
      var tag = r.vent === 'now' ? 'Jetzt lüften' : (r.heating ? 'heizt' : 'ruht');
      var tagStyle = r.vent === 'now' ? 'color: #8fd8ff; font-weight: 600' : (r.heating ? 'color: #ffb340; font-weight: 600' : 'color: rgba(255,255,255,0.72)');
      return {
        name: r.name, icon: r.icon, temp: r.temp, target: r.target, hum: r.hum, tag: tag, tagStyle: tagStyle,
        circle: circle(r.heating ? 'rgba(255,159,10,0.9)' : 'rgba(255,255,255,0.14)'),
        stroke: r.heating ? '#2a1600' : '#fff',
        row: 'display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 14px; box-sizing: border-box' + (last ? '' : '; border-bottom: 1px solid rgba(255,255,255,0.08)')
      };
    };
    var og = [
      { name: 'Büro Anna', icon: I.desk, temp: '19,0', target: '19,0', hum: 62, heating: true, vent: 'now' },
      { name: 'Büro Max', icon: I.desk, temp: '19,2', target: '19,0', hum: 57, heating: false },
      { name: 'Badezimmer', icon: I.bath, temp: '19,1', target: '19,0', hum: 61, heating: false, vent: 'now' },
      { name: 'Schlafzimmer', icon: I.bed, temp: '19,1', target: '19,0', hum: 58, heating: true },
      { name: 'Flur 1.OG', icon: I.door, temp: '19,5', target: '19,0', hum: 59, heating: false }
    ];
    var eg = [
      { name: 'Wohnzimmer', icon: I.sofa, temp: '19,9', target: '20,0', hum: 60, heating: true },
      { name: 'Küche & Esszimmer', icon: I.pot, temp: '19,5', target: '19,0', hum: 58, heating: false },
      { name: 'Flur EG', icon: I.door, temp: '18,9', target: '19,0', hum: 58, heating: true }
    ];
    var mapRows = function (list) { return list.map(function (r, i) { return row(r, i === list.length - 1); }); };
    return {
      tabs: [tab('Klima', I.thermo, true), tab('Licht', I.bulb, false), tab('Energie', I.bolt, false), tab('Schutz', I.shield, false), tab('Robby', I.vacuum, false)],
      floors: [{ name: 'Obergeschoss', rooms: mapRows(og) }, { name: 'Erdgeschoss', rooms: mapRows(eg) }],
      presets: [
        { name: 'Eco', icon: I.leaf, circle: circle('#30d158') },
        { name: 'Komfort', icon: I.sofa, circle: circle('#ff9f0a') },
        { name: 'Boost', icon: I.flame, circle: circle('#ff453a') },
        { name: 'Frost', icon: I.snow, circle: circle('#64d2ff') }
      ]
    };
  }
}
</script>
</body>
</html>
