<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B4 Bubble Raum-Popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #08090c">

<section role="dialog" aria-labelledby="bp-h" style="position: absolute; left: 0; right: 0; top: 60px; bottom: 0; border-radius: 42px 42px 0 0; background: #181a22; background-image: radial-gradient(100% 30% at 50% 0%, rgba(255,214,10,0.16), transparent 70%); padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 12px">

<!-- Header pill -->
<header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.08)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #ffd60a; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2b2200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"></path></svg></span>
<h1 id="bp-h" style="flex: 1; margin: 0; font-size: 18px; font-weight: 700">Wohnzimmer</h1>
<span style="height: 32px; padding: 0 10px; border-radius: 16px; background: rgba(255,255,255,0.1); display: flex; align-items: center; font-size: 12px; font-weight: 600">60 %</span>
<a href="BubbleRooms.dc.html" aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</header>

<!-- Climate -->
<div style="border-radius: 32px; background: linear-gradient(135deg, rgba(255,159,10,0.28), rgba(255,255,255,0.05) 70%); padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #ff9f0a; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 26px; font-weight: 700; line-height: 1">19,9°</span><span style="display: block; font-size: 12px; color: #ffd29a">heizt auf 20,0°</span></span>
<button type="button" aria-label="Soll senken" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 20px">−</button>
<span style="min-width: 44px; text-align: center; font-size: 16px; font-weight: 700; color: #ffc061">20,0°</span>
<button type="button" aria-label="Soll erhöhen" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 20px">+</button>
</div>
<div role="group" aria-label="Preset" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button type="button" style="{{p.style}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{p.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>{{p.name}} {{p.temp}}°</button>
</sc-for>
</div>
<div style="display: flex; gap: 6px; font-size: 12px">
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.1); display: flex; align-items: center">Taupunkt 11,8°</span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.1); display: flex; align-items: center">PM2.5 1</span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(48,209,88,0.2); color: #7ee8a0; display: flex; align-items: center">3 Fenster zu</span>
</div>
</div>

<!-- Lights -->
<div style="display: flex; align-items: center; gap: 10px; margin: 4px 6px 0">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Licht</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
<button type="button" style="height: 30px; padding: 0 12px; border-radius: 15px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-weight: 600">Alle aus</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{lights}}" as="l" hint-placeholder-count="4">
<button type="button" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px; border-radius: 26px; border: none; background: linear-gradient(90deg, rgba(255,214,10,0.42), rgba(255,214,10,0.14)); color: #fff; text-align: left">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #ffd60a; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2b2200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg></span>
<span><span style="display: block; font-size: 14px; font-weight: 600">{{l.name}}</span><span style="display: block; font-size: 11px; color: rgba(255,255,255,0.8)">An</span></span>
</button>
</sc-for>
</div>

<!-- Devices -->
<div style="display: flex; align-items: center; gap: 10px; margin: 4px 6px 0">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Geräte</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
</div>
<sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
<button type="button" style="{{d.pill}}">
<span style="{{d.circle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{d.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
<span style="flex: 1; text-align: left"><span style="display: block; font-size: 14px; font-weight: 600">{{d.name}}</span><span style="display: block; font-size: 11px; color: rgba(255,255,255,0.75)">{{d.state}}</span></span>
<span style="{{d.toggle}}"><span style="{{d.knob}}"></span></span>
</button>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      leaf: 'M5 19c8 0 14-6 14-14-8 0-14 6-14 14zM5 19l7-7',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      flame: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z',
      snow: 'M12 2v20M4 6l16 12M20 6 4 18',
      tv: 'M3 6h18v12H3zM8 21h8',
      fan: 'M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4M12 10c0-4 1-7 4-7 2 0 3 2 2 4l-4 3M14 12c4 0 7 1 7 4 0 2-2 3-4 2l-3-4M12 14c0 4-1 7-4 7-2 0-3-2-2-4l4-3M10 12c-4 0-7-1-7-4 0-2 2-3 4-2l3 4',
      drop: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'
    };
    var pre = function (name, temp, icon, c) { return { name: name, temp: temp, icon: icon, c: c, style: 'display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-weight: 600' }; };
    var dev = function (name, state, icon, on, color) {
      return { name: name, state: state, icon: icon,
        pill: 'display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 6px; border-radius: 28px; border: none; color: #fff; background: ' + (on ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)'),
        circle: 'width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: ' + (on ? color : 'rgba(255,255,255,0.1)'),
        stroke: on ? '#101010' : '#fff',
        toggle: 'position: relative; width: 48px; height: 28px; border-radius: 14px; background: ' + (on ? color : 'rgba(255,255,255,0.18)'),
        knob: 'position: absolute; top: 3px; ' + (on ? 'right: 3px' : 'left: 3px') + '; width: 22px; height: 22px; border-radius: 11px; background: #fff' };
    };
    return {
      presets: [pre('Eco', '18', I.leaf, '#7ee8a0'), pre('Komf.', '19', I.sofa, '#ffc061'), pre('Boost', '20', I.flame, '#ff8a7a'), pre('Frost', '7', I.snow, '#8fd8ff')],
      lights: [{ name: 'Stehlampe' }, { name: 'Sideboard' }, { name: 'Couch' }, { name: 'Vase' }],
      devices: [
        dev('Heimkino', 'An · 18 W', I.tv, true, '#64d2ff'),
        dev('Luftreiniger', 'An · PM2.5 1', I.fan, true, '#30d158'),
        dev('Luftentfeuchter', 'Aus', I.drop, false, '')
      ]
    };
  }
}
</script>
</body>
</html>
