<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B1 Bubble Räume</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #101218; background-image: radial-gradient(100% 40% at 50% 0%, rgba(110,90,200,0.35), transparent 70%), radial-gradient(80% 40% at 100% 60%, rgba(40,120,140,0.25), transparent 70%); padding: 22px 14px 32px; display: flex; flex-direction: column; gap: 12px">

<header style="padding: 0 6px">
<div style="font-size: 14px; color: rgba(255,255,255,0.72)">Samstag, 24. Oktober</div>
<h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 700">Guten Abend</h1>
</header>

<!-- Sub-buttons -->
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{subs}}" as="s" hint-placeholder-count="5">
<span style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 17px; background: rgba(255,255,255,0.08); font-size: 13px; font-weight: 500">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{s.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>{{s.label}}
</span>
</sc-for>
</div>

<!-- Ventilation pill -->
<a href="#" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px; border-radius: 30px; background: linear-gradient(90deg, rgba(90,200,250,0.35), rgba(90,200,250,0.12)); border: 1px solid rgba(90,200,250,0.35)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #5ac8fa; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06202c" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Jetzt lüften</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.8)">Bad, Büro Anna · 15 min</span></span>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.14); display: flex; align-items: center; font-size: 12px; font-weight: 600; margin-right: 6px">Starten</span>
</a>

<!-- Floors -->
<sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; margin: 6px 6px 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>
<h2 style="margin: 0; font-size: 15px; font-weight: 600">{{f.name}}</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
</div>
<sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="4">
<a href="BubbleRoom.dc.html" style="{{r.pill}}">
<span style="{{r.circle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{r.name}}</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">{{r.sub}}</span></span>
<span style="display: flex; gap: 4px; margin-right: 6px">
<sc-for list="{{r.subs}}" as="s" hint-placeholder-count="2">
<span style="{{s.style}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{s.c}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>{{s.label}}</span>
</sc-for>
</span>
</a>
</sc-for>
</section>
</sc-for>

<!-- Below fold -->
<section style="display: flex; flex-direction: column; gap: 8px; margin-top: 40px">
<div style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #30d158; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b1a10" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Energie</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">PV 0 W · Verbrauch 92 W</span></span>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(48,209,88,0.2); color: #7ee8a0; display: flex; align-items: center; font-size: 12px; font-weight: 600; margin-right: 6px">Akku 25 %</span>
</div>
</section>

<!-- Floating nav (bubble horizontal buttons stack) -->
<nav aria-label="Bereiche" style="position: absolute; left: 14px; right: 14px; top: 760px; display: flex; gap: 6px; padding: 6px; border-radius: 34px; background: rgba(30,32,40,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="#" style="{{n.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: 4px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      drop: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      bulb: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z',
      battery: 'M3 8h15a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM21 11v2M5 11v2',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      flame: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z',
      wind: 'M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8',
      desk: 'M4 5h16v10H4zM9 19h6M12 15v4',
      bath: 'M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0',
      bed: 'M3 18V7M3 13h18v5M7 13v-3h5v3',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      pot: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h2M20 10h2M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2'
    };
    var sub = function (icon, label, c, bg) { return { icon: icon, label: label, c: c, style: 'display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 16px; font-size: 13px; font-weight: 600; background: ' + bg }; };
    var room = function (r) {
      var subs = [];
      if (r.vent) subs.push(sub(I.wind, '', '#06202c', '#5ac8fa'));
      if (r.lights) subs.push(sub(I.bulb, String(r.lights), '#3d3000', '#ffd60a'));
      subs.push(sub(I.thermo, r.temp + '°', r.heating ? '#ffb340' : 'rgba(255,255,255,0.8)', r.heating ? 'rgba(255,159,10,0.2)' : 'rgba(255,255,255,0.1)'));
      var accent = r.lights ? '#ffd60a' : (r.heating ? '#ff9f0a' : 'rgba(255,255,255,0.12)');
      return {
        name: r.name, icon: r.icon, subs: subs,
        sub: r.hum + ' %' + (r.heating ? ' · heizt' : '') + (r.extra ? ' · ' + r.extra : ''),
        pill: 'display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px; border-radius: 30px; background: ' + (r.lights ? 'linear-gradient(90deg, rgba(255,214,10,0.22), rgba(255,255,255,0.06) 60%)' : 'rgba(255,255,255,0.07)'),
        circle: 'flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: ' + accent,
        stroke: (r.lights || r.heating) ? '#1a1206' : '#fff'
      };
    };
    var nav = function (label, icon, active) {
      return { label: label, icon: icon, c: active ? '#101218' : 'rgba(255,255,255,0.85)',
        style: 'flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600; ' + (active ? 'background: #ffffff; color: #101218' : 'color: rgba(255,255,255,0.85)') };
    };
    return {
      subs: [
        { icon: I.thermo, label: '19,3°', c: '#ffb340' },
        { icon: I.drop, label: '59 %', c: '#5ac8fa' },
        { icon: I.bulb, label: '5 an', c: '#ffd60a' },
        { icon: I.battery, label: '25 %', c: '#30d158' },
        { icon: I.shield, label: 'Unscharf', c: '#bf9bff' }
      ],
      floors: [
        { name: 'Obergeschoss', rooms: [
          room({ name: 'Büro Anna', icon: I.desk, temp: '19,0', hum: 62, heating: true, vent: true }),
          room({ name: 'Büro Max', icon: I.desk, temp: '19,2', hum: 57, extra: 'Luftreiniger' }),
          room({ name: 'Badezimmer', icon: I.bath, temp: '19,1', hum: 61, vent: true }),
          room({ name: 'Schlafzimmer', icon: I.bed, temp: '19,1', hum: 58, heating: true }),
          room({ name: 'Flur 1.OG', icon: I.door, temp: '19,5', hum: 59, extra: 'Klima aus' })
        ] },
        { name: 'Erdgeschoss', rooms: [
          room({ name: 'Wohnzimmer', icon: I.sofa, temp: '19,9', hum: 60, heating: true, lights: 4 }),
          room({ name: 'Küche & Esszimmer', icon: I.pot, temp: '19,5', hum: 58, extra: 'Luftreiniger' }),
          room({ name: 'Flur EG', icon: I.door, temp: '18,9', hum: 58, heating: true, lights: 1 })
        ] }
      ],
      nav: [nav('Home', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z', true), nav('Klima', I.thermo, false), nav('Energie', I.bolt, false), nav('Schutz', I.shield, false)]
    };
  }
}
</script>
</body>
</html>
