<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B2 Bubble Tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #101218; background-image: radial-gradient(100% 40% at 50% 0%, rgba(255,140,60,0.28), transparent 70%), radial-gradient(80% 40% at 0% 60%, rgba(110,90,200,0.25), transparent 70%); padding: 22px 14px 32px; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 6px">
<div>
<div style="font-size: 14px; color: rgba(255,255,255,0.72)">4 von 8 Räumen heizen</div>
<h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 700">Klima</h1>
</div>
<button type="button" aria-pressed="true" aria-label="Zentralheizung" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 20px; border: none; background: #ff9f0a; color: #1a1206; font-size: 13px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z"></path></svg>An
</button>
</header>

<!-- Outdoor + vent row -->
<div style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4H7M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Außen 10,5°</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">80 % · Taupunkt 7,2°</span></span>
<span style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 16px; background: #5ac8fa; color: #06202c; font-size: 12px; font-weight: 600; margin-right: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06202c" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"></path></svg>15 min</span>
</div>

<sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; margin: 6px 6px 0">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">{{f.name}}</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
</div>
<sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="4">
<div style="{{r.pill}}">
<span style="{{r.circle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="{{r.subStyle}}">{{r.cur}}° · {{r.sub}}</span></span>
<span style="display: flex; align-items: center; gap: 4px; margin-right: 6px">
<button type="button" aria-label="Soll senken" style="width: 34px; height: 34px; border-radius: 17px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 18px">−</button>
<span style="{{r.targetStyle}}">{{r.target}}°</span>
<button type="button" aria-label="Soll erhöhen" style="width: 34px; height: 34px; border-radius: 17px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 18px">+</button>
</span>
</div>
</sc-for>
</section>
</sc-for>

<!-- Below fold -->
<section style="display: flex; flex-direction: column; gap: 8px; margin-top: 50px">
<div style="display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="flex: 1; font-size: 14px; font-weight: 600; padding-left: 10px">Alle</span>
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button type="button" aria-label="{{p.name}}" style="{{p.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#101010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>{{p.name}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6 4 18"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Klimaanlage OG</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">Aus · 20,5° innen</span></span>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.1); display: flex; align-items: center; font-size: 13px; font-weight: 600; margin-right: 6px">24°</span>
</div>
</section>

<nav aria-label="Bereiche" style="position: absolute; left: 14px; right: 14px; top: 760px; display: flex; gap: 6px; padding: 6px; border-radius: 34px; background: rgba(30,32,40,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="#" style="{{n.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: 4px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      bulb: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      flame: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z',
      leaf: 'M5 19c8 0 14-6 14-14-8 0-14 6-14 14zM5 19l7-7',
      snow: 'M12 2v20M4 6l16 12M20 6 4 18',
      desk: 'M4 5h16v10H4zM9 19h6M12 15v4',
      bath: 'M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0',
      bed: 'M3 18V7M3 13h18v5M7 13v-3h5v3',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      pot: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h2M20 10h2M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2'
    };
    var room = function (r) {
      return {
        name: r.name, icon: r.icon, cur: r.cur, target: r.target,
        sub: r.vent ? r.hum + ' % · lüften' : r.hum + ' %' + (r.heating ? ' · heizt' : ''),
        subStyle: r.vent ? 'display: block; font-size: 12px; color: #8fd8ff; font-weight: 600' : 'display: block; font-size: 12px; color: rgba(255,255,255,0.72)',
        pill: 'display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 6px 0 8px; border-radius: 30px; background: ' + (r.heating ? 'linear-gradient(90deg, rgba(255,159,10,0.22), rgba(255,255,255,0.06) 60%)' : 'rgba(255,255,255,0.07)'),
        circle: 'flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: ' + (r.heating ? '#ff9f0a' : 'rgba(255,255,255,0.12)'),
        stroke: r.heating ? '#1a1206' : '#fff',
        targetStyle: 'min-width: 44px; text-align: center; font-size: 15px; font-weight: 700; color: ' + (r.heating ? '#ffc061' : '#fff')
      };
    };
    var nav = function (label, icon, active) {
      return { label: label, icon: icon, c: active ? '#101218' : 'rgba(255,255,255,0.85)',
        style: 'flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 22px; font-size: 13px; font-weight: 600; ' + (active ? 'background: #ffffff; color: #101218' : 'color: rgba(255,255,255,0.85)') };
    };
    var pre = function (name, icon, bg) { return { name: name, icon: icon, style: 'display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 9px; border-radius: 18px; border: none; font-size: 12px; font-weight: 600; color: #101010; background: ' + bg }; };
    return {
      floors: [
        { name: 'Obergeschoss', rooms: [
          room({ name: 'Büro Anna', icon: I.desk, cur: '19,0', target: '19,0', hum: 62, heating: true, vent: true }),
          room({ name: 'Büro Max', icon: I.desk, cur: '19,2', target: '19,0', hum: 57 }),
          room({ name: 'Badezimmer', icon: I.bath, cur: '19,1', target: '19,0', hum: 61, vent: true }),
          room({ name: 'Schlafzimmer', icon: I.bed, cur: '19,1', target: '19,0', hum: 58, heating: true }),
          room({ name: 'Flur 1.OG', icon: I.door, cur: '19,5', target: '19,0', hum: 59 })
        ] },
        { name: 'Erdgeschoss', rooms: [
          room({ name: 'Wohnzimmer', icon: I.sofa, cur: '19,9', target: '20,0', hum: 60, heating: true }),
          room({ name: 'Küche & Essen', icon: I.pot, cur: '19,5', target: '19,0', hum: 58 }),
          room({ name: 'Flur EG', icon: I.door, cur: '18,9', target: '19,0', hum: 58, heating: true })
        ] }
      ],
      presets: [pre('Eco', I.leaf, '#30d158'), pre('Komf.', I.sofa, '#ff9f0a'), pre('Boost', I.flame, '#ff6b5e'), pre('Frost', I.snow, '#64d2ff')],
      nav: [nav('Home', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z', false), nav('Klima', I.thermo, true), nav('Licht', I.bulb, false), nav('Energie', I.bolt, false)]
    };
  }
}
</script>
</body>
</html>
