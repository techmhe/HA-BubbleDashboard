<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Büro Max</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d1220}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; min-height: 1240px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #ffffff; background-color: #0d1220; background-image: radial-gradient(circle at 80% 6%, rgba(84,118,206,0.42), transparent 42%), radial-gradient(circle at 5% 50%, rgba(214,128,86,0.22), transparent 45%); padding: 0 16px 32px; display: flex; flex-direction: column; gap: 16px">

<nav aria-label="Zurück" style="display: flex; align-items: center; gap: 8px; height: 64px">
<a href="Main.dc.html" aria-label="Zurück zu Home" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.14)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 20px; font-weight: 700">Büro Max</span>
</nav>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 18px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); font-size: 13px">19,2 °C</span>
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 18px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); font-size: 13px">57 %</span>
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 18px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); font-size: 13px">Taupunkt 10,4°</span>
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 18px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); font-size: 13px">Fenster zu</span>
</div>

<!-- Scenes -->
<section aria-label="Szenen" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="min-height: 64px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #fff; font-size: 14px; font-weight: 600">Work</button>
<button type="button" style="min-height: 64px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #fff; font-size: 14px; font-weight: 600">Game</button>
<button type="button" style="min-height: 64px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #fff; font-size: 14px; font-weight: 600">Alles aus</button>
</section>

<!-- Heating -->
<article style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 24px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Heizung</h2>
<span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8)">Ruht</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 38px; font-weight: 600; letter-spacing: -0.02em; line-height: 1">19,2°</span>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Soll senken" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #fff; font-size: 22px">−</button>
<div style="min-width: 60px; text-align: center"><div style="font-size: 18px; font-weight: 600; color: #ffd2a3">19,0°</div><div style="font-size: 10px; color: rgba(255,255,255,0.72)">Soll</div></div>
<button type="button" aria-label="Soll erhöhen" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #fff; font-size: 22px">+</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button type="button" style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #fff"><span style="display: block; font-size: 12px; font-weight: 600">Eco</span><span style="display: block; font-size: 11px; opacity: 0.75">18°</span></button>
<button type="button" style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #fff"><span style="display: block; font-size: 12px; font-weight: 600">Komfort</span><span style="display: block; font-size: 11px; opacity: 0.75">19,5°</span></button>
<button type="button" style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #fff"><span style="display: block; font-size: 12px; font-weight: 600">Boost</span><span style="display: block; font-size: 11px; opacity: 0.75">21,5°</span></button>
<button type="button" style="min-height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #fff"><span style="display: block; font-size: 12px; font-weight: 600">Frost</span><span style="display: block; font-size: 11px; opacity: 0.75">7°</span></button>
</div>
</article>

<!-- Lights -->
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 6px 4px 0; font-size: 17px; font-weight: 600">Licht</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{lights}}" as="l" hint-placeholder-count="6">
<button type="button" style="{{l.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>
<span style="display: block; font-size: 14px; font-weight: 600; margin-top: 8px">{{l.name}}</span>
<span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72); margin-top: 2px">{{l.state}}</span>
</button>
</sc-for>
</div>
</section>

<!-- Devices -->
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 6px 4px 0; font-size: 17px; font-weight: 600">Geräte</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="text-align: left; min-height: 96px; padding: 14px; border-radius: 22px; border: 1px solid rgba(126,224,166,0.45); background: rgba(126,224,166,0.14); color: #fff">
<span style="display: block; font-size: 14px; font-weight: 600">Luftreiniger</span>
<span style="display: block; font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 4px">An · PM2.5 1 µg/m³</span>
</button>
<button type="button" style="text-align: left; min-height: 96px; padding: 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff">
<span style="display: block; font-size: 14px; font-weight: 600">Schreibtisch</span>
<span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72); margin-top: 4px">Aus</span>
</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var off = 'text-align: left; min-height: 104px; padding: 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff';
    var na = 'text-align: left; min-height: 104px; padding: 14px; border-radius: 22px; border: 1px dashed rgba(255,255,255,0.25); background: transparent; color: rgba(255,255,255,0.7)';
    return {
      lights: [
        { name: 'Deckenleuchte', state: 'Aus', style: off },
        { name: 'Stehlampe', state: 'Aus', style: off },
        { name: 'Stimmungslicht', state: 'Aus', style: off },
        { name: 'Lixhult', state: 'Aus', style: off },
        { name: 'Regale', state: 'Aus', style: off },
        { name: 'Tisch-LED', state: 'Nicht verfügbar', style: na }
      ]
    };
  }
}
</script>
</body>
</html>
