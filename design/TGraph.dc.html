<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Popup Verlauf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090c}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #08090c">
<section role="dialog" aria-labelledby="g-h" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; border-radius: 42px 42px 0 0; background: #181a22; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.08)">
<a href="TKlimaPopup.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex: 1"><h1 id="g-h" style="margin: 0; font-size: 18px; font-weight: 700">Wohnzimmer · Verlauf</h1><span style="font-size: 12px; color: rgba(255,255,255,0.72)">Stundenmittel aus HA</span></span>
</header>

<div role="tablist" aria-label="Zeitraum" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 22px; background: rgba(255,255,255,0.06)">
<button type="button" role="tab" aria-selected="true" style="height: 38px; border-radius: 19px; border: none; background: #fff; color: #101218; font-size: 13px; font-weight: 700">24 h</button>
<button type="button" role="tab" style="height: 38px; border-radius: 19px; border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700">7 Tage</button>
<button type="button" role="tab" style="height: 38px; border-radius: 19px; border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700">30 Tage</button>
</div>

<!-- Temperature chart -->
<figure style="margin: 0; padding: 14px 12px 10px; border-radius: 28px; background: rgba(255,159,10,0.08)">
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px">
<span style="font-size: 14px; font-weight: 600; color: #ffc061">Temperatur</span>
<span style="font-size: 12px; color: rgba(255,255,255,0.75)">17,7° – 20,2° · jetzt 20,1°</span>
</figcaption>
<svg width="338" height="140" viewBox="0 0 338 140" role="img" aria-label="Temperaturverlauf 24 Stunden, Minimum 17,7 Grad am Morgen, jetzt 20,1 Grad">
<line x1="0" y1="20" x2="338" y2="20" stroke="rgba(255,255,255,0.08)"></line>
<line x1="0" y1="70" x2="338" y2="70" stroke="rgba(255,255,255,0.08)"></line>
<line x1="0" y1="120" x2="338" y2="120" stroke="rgba(255,255,255,0.08)"></line>
<text x="334" y="16" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="end">21°</text>
<text x="334" y="66" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="end">19°</text>
<text x="334" y="116" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="end">17°</text>
<polygon points="{{tArea}}" fill="rgba(255,159,10,0.16)"></polygon>
<polyline points="{{tLine}}" fill="none" stroke="#ff9f0a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
<circle cx="{{tLastX}}" cy="{{tLastY}}" r="4.5" fill="#ff9f0a" stroke="#181a22" stroke-width="2"></circle>
</svg>
</figure>

<!-- Humidity chart -->
<figure style="margin: 0; padding: 14px 12px 10px; border-radius: 28px; background: rgba(90,200,250,0.08)">
<figcaption style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px">
<span style="font-size: 14px; font-weight: 600; color: #8fd8ff">Luftfeuchte</span>
<span style="font-size: 12px; color: rgba(255,255,255,0.75)">55 – 63 % · jetzt 59 %</span>
</figcaption>
<svg width="338" height="140" viewBox="0 0 338 140" role="img" aria-label="Luftfeuchteverlauf 24 Stunden, Abfall von 63 auf 55 Prozent am Vormittag, jetzt 59 Prozent">
<rect x="0" y="{{band60}}" width="338" height="{{bandH}}" fill="rgba(255,255,255,0.04)"></rect>
<line x1="0" y1="{{line60}}" x2="338" y2="{{line60}}" stroke="rgba(90,200,250,0.5)" stroke-dasharray="4 4"></line>
<text x="4" y="{{band60Label}}" fill="rgba(143,216,255,0.85)" font-size="10">60 % Lüftgrenze</text>
<line x1="0" y1="120" x2="338" y2="120" stroke="rgba(255,255,255,0.08)"></line>
<text x="334" y="16" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="end">65 %</text>
<text x="334" y="116" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="end">53 %</text>
<polygon points="{{hArea}}" fill="rgba(90,200,250,0.16)"></polygon>
<polyline points="{{hLine}}" fill="none" stroke="#5ac8fa" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
<circle cx="{{hLastX}}" cy="{{hLastY}}" r="4.5" fill="#5ac8fa" stroke="#181a22" stroke-width="2"></circle>
</svg>
<div style="display: flex; justify-content: space-between; padding: 2px 4px 0; font-size: 11px; color: rgba(255,255,255,0.6)">
<span>19 Uhr</span><span>01</span><span>07</span><span>13</span><span>jetzt</span>
</div>
</figure>

<div style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 14px; box-sizing: border-box; border-radius: 24px; background: rgba(255,255,255,0.06); font-size: 12px; color: rgba(255,255,255,0.8); line-height: 1.4">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"></path></svg>
<span>Vormittag gelüftet: Feuchte 63 → 55 %, Raum kurz auf 17,7° abgekühlt.</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var t = [19.1, 19.1, 20.2, 19.8, 19.3, 18.8, 18.4, 18.2, 17.9, 17.8, 18.1, 18.3, 18.1, 17.8, 17.7, 19.1, 19.0, 19.1, 19.0, 19.1, 19.1, 20.0, 20.1];
    var h = [61.4, 61.3, 60.1, 61.2, 62.2, 62.4, 62.6, 62.8, 63.0, 63.2, 62.9, 62.1, 62.6, 59.0, 55.1, 56.2, 57.4, 57.8, 58.1, 58.2, 58.9, 59.1, 59.3];
    var W = 300, top = 20, bottom = 120;
    var map = function (arr, lo, hi) {
      return arr.map(function (v, i) {
        var x = Math.round(i / (arr.length - 1) * W * 10) / 10;
        var y = Math.round((bottom - (v - lo) / (hi - lo) * (bottom - top)) * 10) / 10;
        return [x, y];
      });
    };
    var line = function (pts) { return pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' '); };
    var area = function (pts) { return line(pts) + ' ' + W + ',' + bottom + ' 0,' + bottom; };
    var tp = map(t, 17, 21), hp = map(h, 53, 65);
    var y60 = Math.round(bottom - (60 - 53) / (65 - 53) * (bottom - top));
    return {
      tLine: line(tp), tArea: area(tp), tLastX: tp[tp.length - 1][0], tLastY: tp[tp.length - 1][1],
      hLine: line(hp), hArea: area(hp), hLastX: hp[hp.length - 1][0], hLastY: hp[hp.length - 1][1],
      band60: top, bandH: y60 - top, line60: y60, band60Label: y60 - 4
    };
  }
}
</script>
</body>
</html>
