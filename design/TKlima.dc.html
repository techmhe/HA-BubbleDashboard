<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klima</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #101218; background-image: radial-gradient(100% 30% at 50% 0%, rgba(255,140,60,0.26), transparent 70%), radial-gradient(80% 30% at 0% 55%, rgba(90,200,250,0.12), transparent 70%); padding: 22px 14px 32px; display: flex; flex-direction: column; gap: 10px">

<header style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 6px 4px">
<div>
<div style="font-size: 14px; color: rgba(255,255,255,0.72)">4 von 8 Räumen heizen · Luft überall gut</div>
<h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 700">Klima</h1>
</div>
<button type="button" aria-pressed="true" aria-label="Zentralheizung an" style="display: flex; align-items: center; height: 44px; padding: 0 6px; border-radius: 22px; border: none; background: rgba(255,159,10,0.2)">
<span style="position: relative; width: 52px; height: 32px; border-radius: 16px; background: #ff9f0a"><span style="position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff9f0a" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z"></path></svg></span></span>
</button>
</header>

<!-- Outdoor + vent -->
<a href="TLueften.dc.html" style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(143,208,255,0.2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4H7M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Außen 10,5° · 80 %</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">Taupunkt 7,2° · draußen trockener</span></span>
<span style="display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px; border-radius: 17px; background: #5ac8fa; color: #06202c; font-size: 12px; font-weight: 700; margin-right: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06202c" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"></path></svg>15 min</span>
</a>

<!-- Group presets: icons only -->
<div style="display: flex; align-items: center; gap: 6px; height: 60px; padding: 0 8px 0 16px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="flex: 1; font-size: 14px; font-weight: 600">Alle Räume</span>
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button type="button" aria-label="Alle auf {{p.name}}" title="{{p.name}}" style="{{p.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101010" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></button>
</sc-for>
<a href="TAlleRaeume.dc.html" aria-label="Temperatur für alle Räume einstellen" style="width: 42px; height: 42px; border-radius: 21px; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101218" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14.8V5a2 2 0 1 1 4 0v9.8a4 4 0 1 1-4 0zM17 6h4M19 4v4M17 12h4"></path></svg></a>
</div>

<!-- Floors -->
<sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px; margin: 8px 6px 2px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">{{f.name}}</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
<span style="font-size: 12px; color: rgba(255,255,255,0.72)">{{f.meta}}</span>
</div>
<sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="4">
<div style="{{r.pill}}">
<a href="TKlimaPopup.dc.html" style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0">
<span style="{{r.circle}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="min-width: 0">
<span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<sc-if value="{{r.aq}}" hint-placeholder-val="{{ false }}"><span title="{{r.aqTitle}}" style="display: flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px 0 5px; border-radius: 9px; background: rgba(48,209,88,0.18)"><span style="width: 6px; height: 6px; border-radius: 3px; background: #30d158"></span><sc-if value="{{r.fan}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#7ee8a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Luftreiniger an" role="img"><path d="M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4M12 10c0-4 1-7 4-7 2 0 3 2 2 4l-4 3M14 12c4 0 7 1 7 4 0 2-2 3-4 2l-3-4M12 14c0 4-1 7-4 7-2 0-3-2-2-4l4-3M10 12c-4 0-7-1-7-4 0-2 2-3 4-2l3 4"></path></svg></sc-if></span></sc-if>
</span>
<span style="{{r.subStyle}}">{{r.cur}}° · {{r.hum}} % · {{r.state}}</span>
</span>
</a>
<span style="display: flex; align-items: center; gap: 2px">
<button type="button" aria-label="Soll senken" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 18px">−</button>
<span style="{{r.targetStyle}}">{{r.target}}°</span>
<button type="button" aria-label="Soll erhöhen" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 18px">+</button>
</span>
</div>
</sc-for>
<sc-if value="{{f.ac}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 6px 0 8px; border-radius: 30px; background: rgba(255,255,255,0.07)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(100,210,255,0.18); display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6 4 18"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Klimaanlage</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72)">Aus · 20,5° innen · Soll 24°</span></span>
<span style="display: flex; gap: 4px">
<button type="button" aria-label="Kühlen" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6 4 18"></path></svg></button>
<button type="button" aria-label="Trocknen" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg></button>
<button type="button" aria-label="Aus" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#101218" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0"></path></svg></button>
</span>
</div>
</sc-if>
</section>
</sc-for>

<nav aria-label="Bereiche" style="position: absolute; left: 14px; right: 14px; top: 768px; display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: rgba(30,32,40,0.88); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.55)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" aria-label="{{n.name}}" style="{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg><sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}">{{n.name}}</sc-if></a>
</sc-for>
</nav>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: 4px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
      flame: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1 1.5 2 3 2-1-3 0-5 0-7z',
      leaf: 'M5 19c8 0 14-6 14-14-8 0-14 6-14 14zM5 19l7-7',
      snow: 'M12 2v20M4 6l16 12M20 6 4 18',
      desk: 'M4 5h16v10H4zM9 19h6M12 15v4',
      bath: 'M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0',
      bed: 'M3 18V7M3 13h18v5M7 13v-3h5v3',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      pot: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h2M20 10h2M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2'
    };
    var circ = function (bg, s) { return 'flex-shrink: 0; width: ' + s + 'px; height: ' + s + 'px; border-radius: ' + (s / 2) + 'px; display: flex; align-items: center; justify-content: center; background: ' + bg; };
    var room = function (r) {
      var state = r.vent ? 'lüften' : (r.heating ? 'heizt' : 'Soll erreicht');
      return {
        name: r.name, icon: r.icon, cur: r.cur, target: r.target, hum: r.hum, state: state,
        aq: !!(r.pm || r.fan), fan: !!r.fan, aqTitle: r.pm ? 'PM2.5 ' + r.pm + ' µg/m³ · gut' : 'Luftreiniger an',
        subStyle: r.vent ? 'display: block; font-size: 12px; color: #8fd8ff' : (r.heating ? 'display: block; font-size: 12px; color: #ffc061' : 'display: block; font-size: 12px; color: rgba(255,255,255,0.72)'),
        pill: 'display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 6px 0 8px; border-radius: 30px; background: ' + (r.heating ? 'linear-gradient(90deg, rgba(255,159,10,0.24), rgba(255,255,255,0.06) 65%)' : (r.vent ? 'linear-gradient(90deg, rgba(90,200,250,0.22), rgba(255,255,255,0.06) 65%)' : 'rgba(255,255,255,0.07)')),
        circle: circ(r.heating ? '#ff9f0a' : (r.vent ? '#5ac8fa' : 'rgba(255,255,255,0.12)'), 44),
        stroke: (r.heating || r.vent) ? '#141008' : '#fff',
        targetStyle: 'min-width: 46px; text-align: center; font-size: 15px; font-weight: 700; color: ' + (r.heating ? '#ffc061' : '#fff')
      };
    };
    var pre = function (name, icon, bg) { return { name: name, icon: icon, style: 'width: 42px; height: 42px; border-radius: 21px; border: none; display: flex; align-items: center; justify-content: center; background: ' + bg }; };
    var nav = function (name, icon, href, active) {
      return { name: name, icon: icon, href: href, active: active, c: active ? '#101218' : 'rgba(255,255,255,0.8)',
        style: (active ? 'flex: 2; background: #fff; color: #101218' : 'flex: 1') + '; display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 23px; font-size: 13px; font-weight: 700' };
    };
    return {
      presets: [pre('Eco', I.leaf, '#30d158'), pre('Komfort', I.sofa, '#ff9f0a'), pre('Boost', I.flame, '#ff6b5e'), pre('Frost', I.snow, '#64d2ff')],
      floors: [
        { name: 'Obergeschoss', meta: 'Ø 19,2°', ac: true, rooms: [
          room({ name: 'Büro Anna', icon: I.desk, cur: '19,0', target: '19,0', hum: 62, heating: true, vent: true, pm: 1, fan: true }),
          room({ name: 'Büro Max', icon: I.desk, cur: '19,2', target: '19,0', hum: 57, pm: 1, fan: true }),
          room({ name: 'Badezimmer', icon: I.bath, cur: '19,1', target: '19,0', hum: 61, vent: true }),
          room({ name: 'Schlafzimmer', icon: I.bed, cur: '19,1', target: '19,0', hum: 58, heating: true, fan: true }),
          room({ name: 'Flur 1.OG', icon: I.door, cur: '19,5', target: '19,0', hum: 59 })
        ] },
        { name: 'Erdgeschoss', meta: 'Ø 19,4°', ac: false, rooms: [
          room({ name: 'Wohnzimmer', icon: I.sofa, cur: '19,9', target: '20,0', hum: 60, heating: true, pm: 1, fan: true }),
          room({ name: 'Küche & Essen', icon: I.pot, cur: '19,5', target: '19,0', hum: 58, pm: 1, fan: true }),
          room({ name: 'Flur EG', icon: I.door, cur: '18,9', target: '19,0', hum: 58, heating: true })
        ] }
      ],
      nav: [nav('Übersicht', I.home, 'TUebersicht.dc.html', false), nav('Klima', I.thermo, 'TKlima.dc.html', true), nav('Räume', I.grid, 'TRaeume.dc.html', false), nav('Energie', I.bolt, 'TEnergie.dc.html', false), nav('Schutz', I.shield, 'TSchutz.dc.html', false)]
    };
  }
}
</script>
</body>
</html>
