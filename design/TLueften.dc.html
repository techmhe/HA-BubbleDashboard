<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lüften läuft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090c}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #08090c">

<!-- Push banner -->
<div role="status" aria-label="Push-Benachrichtigung" style="position: absolute; left: 10px; right: 10px; top: 10px; z-index: 2; padding: 12px 14px; border-radius: 26px; background: rgba(242,242,247,0.94); color: #11151c; box-shadow: 0 12px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #18bcf2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 700">Badezimmer: Fenster schließen</span><span style="display: block; font-size: 13px; color: #3a404b">15 min gelüftet · Feuchte 61 → 52 %</span></span>
<span style="font-size: 11px; color: #6a707b; align-self: flex-start">jetzt</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 40px; border-radius: 20px; border: none; background: #11151c; color: #fff; font-size: 13px; font-weight: 700">Ist zu</button>
<button type="button" style="height: 40px; border-radius: 20px; border: 1px solid #b8bfcb; background: transparent; color: #11151c; font-size: 13px; font-weight: 700">+5 min</button>
</div>
</div>

<section role="dialog" aria-labelledby="lf-h" style="position: absolute; left: 0; right: 0; top: 150px; bottom: 0; border-radius: 42px 42px 0 0; background: #161a22; background-image: radial-gradient(100% 35% at 50% 0%, rgba(90,200,250,0.24), transparent 70%); padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.65); padding-left: 8px">Beispielszenario · Werte illustrativ</div>

<header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.08)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #5ac8fa; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06202c" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"></path></svg></span>
<h1 id="lf-h" style="flex: 1; margin: 0; font-size: 18px; font-weight: 700">Lüften · Badezimmer</h1>
<a href="TUebersicht.dc.html" aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</header>

<!-- Ring timer -->
<div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 34px; background: rgba(90,200,250,0.1)">
<span style="position: relative; width: 112px; height: 112px; border-radius: 56px; background: conic-gradient(#5ac8fa 0 100%); display: flex; align-items: center; justify-content: center">
<span style="width: 92px; height: 92px; border-radius: 46px; background: #161a22; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 26px; font-weight: 700">15:00</span><span style="font-size: 11px; color: #8fd8ff">fertig</span></span>
</span>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<span><span style="color: rgba(255,255,255,0.72)">Feuchte</span> <strong>61 → 52 %</strong></span>
<span><span style="color: rgba(255,255,255,0.72)">Raum</span> <strong>19,1 → 17,6°</strong></span>
<span><span style="color: rgba(255,255,255,0.72)">Heizung</span> <strong>pausiert (7°)</strong></span>
</div>
</div>

<!-- Rules -->
<div style="display: flex; align-items: center; gap: 10px; margin: 4px 6px 0">
<h2 style="margin: 0; font-size: 14px; font-weight: 600">Push „Fenster schließen“, wenn …</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
</div>
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 12px 6px 6px; border-radius: 28px; background: rgba(255,255,255,0.07); box-sizing: border-box">
<span style="{{r.circle}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#06202c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span><span style="display: block; font-size: 14px; font-weight: 600">{{r.title}}</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.72); line-height: 1.35">{{r.text}}</span></span>
</div>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var c = 'flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: #5ac8fa';
    return {
      rules: [
        { title: 'Lüftdauer erreicht', text: 'nach Außentemperatur, heute 15 min', icon: 'M12 6v6l4 2M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18', circle: c },
        { title: 'Raum kühlt aus', text: '2 K unter Temperatur beim Öffnen', icon: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z', circle: c },
        { title: 'Lüften bringt nichts mehr', text: 'Taupunkt-Differenz < 1 K oder Feuchte < 50 %', icon: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z', circle: c }
      ]
    };
  }
}
</script>
</body>
</html>
