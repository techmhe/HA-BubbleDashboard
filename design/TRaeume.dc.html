<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Räume</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1900px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #101218; background-image: radial-gradient(100% 18% at 50% 0%, rgba(255,214,10,0.16), transparent 70%); padding: 22px 14px 32px; display: flex; flex-direction: column; gap: 10px">

<header style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 6px 4px">
<div>
<div style="font-size: 14px; color: rgba(255,255,255,0.72)">5 Lichter · 7 Geräte an</div>
<h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 700">Räume</h1>
</div>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0"></path></svg>Licht aus
</button>
</header>

<div role="tablist" aria-label="Filter" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 22px; background: rgba(255,255,255,0.06)">
<button type="button" role="tab" aria-selected="true" style="height: 36px; border-radius: 18px; border: none; background: #fff; color: #101218; font-size: 13px; font-weight: 700">Alle</button>
<button type="button" role="tab" style="height: 36px; border-radius: 18px; border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700">An</button>
<button type="button" role="tab" style="height: 36px; border-radius: 18px; border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700">EG</button>
<button type="button" role="tab" style="height: 36px; border-radius: 18px; border: none; background: transparent; color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700">OG</button>
</div>
<div style="font-size: 11px; color: rgba(255,255,255,0.6); padding: 0 8px">Tippen schaltet · lange drücken öffnet Helligkeit &amp; Farbe</div>

<sc-for list="{{rooms}}" as="r" hint-placeholder-count="9">
<article style="{{r.card}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="{{r.circle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0"><h2 style="margin: 0; font-size: 15px; font-weight: 600">{{r.name}}</h2><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.68)">{{r.sub}}</span></span>
<a href="TKlimaPopup.dc.html" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(255,255,255,0.09); font-size: 12px; font-weight: 600; white-space: nowrap">
<sc-if value="{{r.temp}}" hint-placeholder-val="{{ true }}"><span>{{r.temp}}</span><span style="color: rgba(255,255,255,0.75)">{{r.hum}}</span></sc-if>
<span style="display: flex; align-items: center; gap: 2px; color: #ffc061"><svg width="11" height="11" viewBox="0 0 24 24" fill="#ffc061" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>{{r.power}}</span>
</a>
</div>
<sc-if value="{{r.hasScenes}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{r.scenes}}" as="s" hint-placeholder-count="3">
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 5px; border-radius: 22px; border: none; background: rgba(255,255,255,0.08); color: #fff; text-align: left">
<span style="{{s.circle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{s.stroke}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<span style="font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
</button>
</sc-for>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{r.devices}}" as="d" hint-placeholder-count="3">
<a href="{{d.href}}" style="{{d.tile}}">
<span style="{{d.circle}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{d.stroke}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
<span style="min-width: 0"><span style="display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span><span style="{{d.stateStyle}}">{{d.state}}</span></span>
</a>
</sc-for>
</div>
</article>
</sc-for>

<nav aria-label="Bereiche" style="position: absolute; left: 14px; right: 14px; top: 768px; display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: rgba(30,32,40,0.88); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.55)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" aria-label="{{n.name}}" style="{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg><sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}">{{n.name}}</sc-if></a>
</sc-for>
</nav>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: 4px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',

      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',

      lamp: 'M9 2h6l3 8H6zM12 10v11M8 21h8',
      strip: 'M3 12h18M6 9v6M10 9v6M14 9v6M18 9v6',
      tv: 'M3 6h18v12H3zM8 21h8',
      fan: 'M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4M12 10c0-4 1-7 4-7 2 0 3 2 2 4l-4 3M14 12c4 0 7 1 7 4 0 2-2 3-4 2l-3-4M12 14c0 4-1 7-4 7-2 0-3-2-2-4l4-3M10 12c-4 0-7-1-7-4 0-2 2-3 4-2l3 4',
      drop: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      plug: 'M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4',
      power: 'M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0',
      sofa: 'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z',
      candle: 'M12 2c1.5 2 1.5 3.5 0 5-1.5-1.5-1.5-3 0-5zM9 9h6v13H9z',

      desk: 'M4 5h16v10H4zM9 19h6M12 15v4',
      bath: 'M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0',
      bed: 'M3 18V7M3 13h18v5M7 13v-3h5v3',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01',
      tree: 'M12 2l6 9h-3l4 6H5l4-6H6zM12 17v5',
      boiler: 'M7 3h10v14a5 5 0 0 1-10 0zM10 21h4M12 8v4',
      dryer: 'M4 3h16v18H4zM12 9a4 4 0 1 0 0 8a4 4 0 1 0 0-8M7 6h.01'
    };
    var circ = function (bg, s) { return 'flex-shrink: 0; width: ' + s + 'px; height: ' + s + 'px; border-radius: ' + (s / 2) + 'px; display: flex; align-items: center; justify-content: center; background: ' + bg; };
    var dev = function (name, icon, state, kind, href) {
      var on = state !== 'Aus' && state !== 'n. v.', na = state === 'n. v.';
      var c = kind === 'light' ? '#ffd60a' : '#30d158';
      return { name: name, icon: icon, state: state, href: href || '#',
        tile: 'display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px 0 6px; border-radius: 20px; ' + (on ? 'background: ' + (kind === 'light' ? 'rgba(255,214,10,0.16)' : 'rgba(48,209,88,0.14)') : (na ? 'border: 1px dashed rgba(255,255,255,0.22); box-sizing: border-box' : 'background: rgba(255,255,255,0.06)')),
        circle: circ(on ? c : 'rgba(255,255,255,0.1)', 32), stroke: on ? '#151005' : (na ? 'rgba(255,255,255,0.45)' : '#fff'),
        stateStyle: 'display: block; font-size: 11px; color: ' + (on ? (kind === 'light' ? '#ffe37a' : '#9af0b5') : 'rgba(255,255,255,0.55)') };
    };
    var L = function (n, i, s, h) { return dev(n, i, s, 'light', h); };
    var D = function (n, i, s, h) { return dev(n, i, s, 'device', h); };
    var scene = function (name, icon, color) { return { name: name, icon: icon, circle: circ(color, 34), stroke: color === 'rgba(255,255,255,0.14)' ? '#fff' : '#101010' }; };
    var off = scene('Aus', I.power, 'rgba(255,255,255,0.14)');
    var room = function (name, icon, sub, temp, hum, power, active, scenes, devices) {
      return { name: name, icon: icon, sub: sub, temp: temp, hum: hum, power: power, scenes: scenes || [], hasScenes: !!(scenes && scenes.length), devices: devices,
        card: 'display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 28px; background: ' + (active ? 'linear-gradient(160deg, rgba(255,214,10,0.14), rgba(255,255,255,0.05) 50%)' : 'rgba(255,255,255,0.05)'),
        circle: circ(active ? '#ffd60a' : 'rgba(255,255,255,0.12)', 40), stroke: active ? '#2b2200' : '#fff' };
    };
    var nav = function (name, icon, href, active) {
      return { name: name, icon: icon, href: href, active: active, c: active ? '#101218' : 'rgba(255,255,255,0.8)',
        style: (active ? 'flex: 2; background: #fff; color: #101218' : 'flex: 1') + '; display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 23px; font-size: 13px; font-weight: 700' };
    };
    return {
      rooms: [
        room('Wohnzimmer', I.sofa, 'EG · 6 von 7 an', '19,9°', '60 %', '22 W', true,
          [scene('Cozy', I.candle, '#ffb340'), scene('Heimkino', I.film, '#64d2ff'), off],
          [L('Stehlampe', I.lamp, 'An'), L('Sideboard', I.strip, '100 %', 'TLichtPopup.dc.html'), L('Couch', I.strip, '1 %'), L('Vase', I.bulb, 'An'), D('Heimkino', I.tv, '18 W', 'TGeraete.dc.html'), D('Luftreiniger', I.fan, 'An', 'TGeraete.dc.html'), D('Entfeuchter', I.drop, 'Aus', 'TGeraete.dc.html')]),
        room('Küche & Esszimmer', I.pot, 'EG · 1 von 6 an', '19,5°', '58 %', '0 W', false,
          [scene('Kochen', I.pot, '#ff9f0a'), scene('Essen', I.fork, '#ffd60a'), off],
          [L('Decke', I.bulb, 'n. v.'), L('Abzug', I.bulb, 'Aus'), L('Wandstrip', I.strip, 'Aus'), D('Lampe+Box', I.plug, 'Aus'), D('Warmwasser', I.boiler, 'Aus'), D('Luftreiniger', I.fan, 'An')]),
        room('Flur EG', I.door, 'EG · 1 von 1 an', '18,9°', '58 %', '3 W', true, [], [L('Uhr', I.lamp, 'An')]),
        room('Büro Max', I.desk, 'OG · 1 von 8 an', '19,2°', '57 %', '0 W', false,
          [scene('Work', I.laptop, '#64d2ff'), scene('Game', I.game, '#bf9bff'), off],
          [L('Decke', I.bulb, 'Aus'), L('Stehlampe', I.lamp, 'Aus'), L('Stimmung', I.strip, 'Aus'), L('Lixhult', I.bulb, 'Aus'), L('Regale', I.strip, 'Aus'), L('Tisch-LED', I.strip, 'n. v.'), D('Schreibtisch', I.plug, 'Aus'), D('Luftreiniger', I.fan, 'An')]),
        room('Büro Anna', I.desk, 'OG · 1 von 4 an', '19,0°', '62 %', '0 W', false,
          [scene('Work', I.laptop, '#64d2ff'), scene('Cozy', I.candle, '#ffb340'), off],
          [L('Stehlampe', I.lamp, 'Aus'), L('Decke', I.bulb, 'Aus'), D('Schreibtisch', I.plug, 'Aus'), D('Luftreiniger', I.fan, 'An')]),
        room('Schlafzimmer', I.bed, 'OG · 1 von 2 an', '19,1°', '58 %', '0 W', false, [], [D('TV', I.tv, 'Aus'), D('Luftreiniger', I.fan, 'An')]),
        room('Badezimmer', I.bath, 'OG · alles aus', '19,1°', '61 %', '0 W', false, [], [L('Spiegel', I.bulb, 'Aus'), D('Trockner', I.dryer, 'Aus')]),
        room('Flur 1.OG', I.door, 'OG · alles aus', '19,5°', '59 %', '0 W', false, [], [L('Lampe', I.bulb, 'Aus')]),
        room('Garten', I.tree, 'alles aus', '', '', '0 W', false, [], [D('Brunnen', I.drop, 'Aus')])
      ],
      nav: [nav('Übersicht', I.home, 'TUebersicht.dc.html', false), nav('Klima', I.thermo, 'TKlima.dc.html', false), nav('Räume', I.grid, 'TRaeume.dc.html', true), nav('Energie', I.bolt, 'TEnergie.dc.html', false), nav('Schutz', I.shield, 'TSchutz.dc.html', false)]

  }

</script>
</body>
</html>
