<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schutz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #101218; background-image: radial-gradient(100% 28% at 50% 0%, rgba(191,155,255,0.22), transparent 70%); padding: 22px 14px 32px; display: flex; flex-direction: column; gap: 10px">

<header style="padding: 0 6px 4px">
<div style="font-size: 14px; color: rgba(255,255,255,0.72)">Alles ruhig · 12 von 12 zu</div>
<h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 700">Schutz</h1>
</header>

<!-- Alarm pill -->
<div style="display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 8px; border-radius: 32px; background: linear-gradient(90deg, rgba(191,155,255,0.26), rgba(255,255,255,0.05) 70%)">
<span style="width: 48px; height: 48px; border-radius: 24px; background: #bf9bff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d1030" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 700">Alarm unscharf</span><span style="display: block; font-size: 11px; color: rgba(255,255,255,0.72)">zuletzt ausgelöst 5. Aug.</span></span>
<sc-for list="{{arm}}" as="a" hint-placeholder-count="3">
<button type="button" aria-label="{{a.name}}" title="{{a.name}}" style="width: 42px; height: 42px; border-radius: 21px; border: none; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e2d3ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg></button>
</sc-for>
</div>

<!-- Doorbell pill -->
<section aria-label="Haustür-Kamera" style="border-radius: 30px; overflow: hidden; background: rgba(255,255,255,0.07)">
<div style="position: relative; height: 200px; background: linear-gradient(160deg, #2a2d36, #15171d); display: flex; align-items: center; justify-content: center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Platzhalter für das Live-Bild der Haustür"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"></path></svg>
<span style="position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(0,0,0,0.55); font-size: 11px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 4px; background: #ff453a"></span>Live · Haustür</span>
<span style="position: absolute; right: 10px; top: 10px; display: flex; gap: 6px">
<button type="button" aria-label="Ton an" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"></path></svg></button>
<button type="button" aria-label="Vollbild" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 8px">
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255,255,255,0.1); display: flex; align-items: center; font-size: 12px">Bewegung: nein</span>
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255,255,255,0.1); display: flex; align-items: center; font-size: 12px">Person: nein</span>
<span style="flex: 1"></span>
<button type="button" style="height: 30px; padding: 0 12px; border-radius: 15px; border: none; background: rgba(255,255,255,0.14); color: #fff; font-size: 12px; font-weight: 600">Verlauf</button>
</div>
</section>

<!-- Openings -->
<div style="display: flex; align-items: center; gap: 10px; margin: 6px 6px 0">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Fenster &amp; Türen</h2>
<span aria-hidden="true" style="flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12)"></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.72)"><span style="display: flex; align-items: center; gap: 3px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #30d158"></span>zu</span><span style="display: flex; align-items: center; gap: 3px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #ff453a"></span>offen</span></span>
</div>
<sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin: 2px 8px 0">{{f.name}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 6px 0 14px; border-radius: 23px; background: rgba(255,255,255,0.07)">
<span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="display: flex; gap: 3px">
<sc-for list="{{r.items}}" as="w" hint-placeholder-count="1">
<span title="{{w.title}}" style="{{w.style}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{w.stroke}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{w.title}}"><path d="{{w.icon}}"></path></svg></span>
</sc-for>
</span>
</div>
</sc-for>
</div>
</sc-for>

<nav aria-label="Bereiche" style="position: absolute; left: 14px; right: 14px; top: 768px; display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: rgba(30,32,40,0.88); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.55)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" aria-label="{{n.name}}" style="{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg><sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}">{{n.name}}</sc-if></a>
</sc-for>
</nav>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed rgba(255,214,10,0.7)"><span style="position: absolute; right: 8px; top: 4px; font-size: 11px; font-weight: 600; color: #ffd60a">Bildschirmende</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
      car: 'M5 16l1.5-5h11L19 16M4 16h16v3H4zM7 19v1M17 19v1',
      moon: 'M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10z',
      window: 'M4 3h16v18H4zM12 3v18M4 12h16',
      door: 'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01'
    };
    var item = function (kind, title, open) {
      return { title: title + (open ? ' offen' : ' zu'), icon: kind === 'door' ? I.door : I.window,
        stroke: open ? '#ffd1cf' : '#7ee8a0',
        style: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ' + (open ? '#ff453a' : 'rgba(48,209,88,0.18)') };
    };
    var r = function (name, items) { return { name: name, items: items }; };
    var W = function (t) { return item('window', t, false); };
    var D = function (t) { return item('door', t, false); };
    var nav = function (name, icon, href, active) {
      return { name: name, icon: icon, href: href, active: active, c: active ? '#101218' : 'rgba(255,255,255,0.8)',
        style: (active ? 'flex: 2; background: #fff; color: #101218' : 'flex: 1') + '; display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 23px; font-size: 13px; font-weight: 700' };
    };
    return {
      arm: [{ name: 'Abwesend', icon: I.car }, { name: 'Zuhause', icon: I.home }, { name: 'Nacht', icon: I.moon }],
      floors: [
        { name: 'Erdgeschoss', rooms: [
          r('Wohnzimmer', [W('Eingangsseite'), W('Straße 1'), W('Straße 2')]),
          r('Flur EG', [D('Haustür')]),
          r('Küche', [W('Fenster')]),
          r('Esszimmer', [D('Wintergartentür')])
        ] },
        { name: 'Obergeschoss', rooms: [
          r('Büro Anna', [W('Straße'), W('Eingangsseite')]),
          r('Büro Max', [W('Fenster')]),
          r('Badezimmer', [W('Fenster')]),
          r('Schlafzimmer', [W('Fenster')]),
          r('Flur 1.OG', [W('Fenster')])
        ] }
      ],
      nav: [nav('Übersicht', I.home, 'TUebersicht.dc.html', false), nav('Klima', I.thermo, 'TKlima.dc.html', false), nav('Räume', I.grid, 'TRaeume.dc.html', false), nav('Energie', I.bolt, 'TEnergie.dc.html', false), nav('Schutz', I.shield, 'TSchutz.dc.html', true)]
    };
  }
}
</script>
</body>
</html>
