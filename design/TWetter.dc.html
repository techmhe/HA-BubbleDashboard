<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Popup Wetter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090c}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: #ffffff; background-color: #08090c">
<section role="dialog" aria-labelledby="w-h" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; border-radius: 42px 42px 0 0; background: #161b24; background-image: radial-gradient(100% 35% at 50% 0%, rgba(90,140,220,0.35), transparent 70%); padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 10px">

<header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(255,255,255,0.08)">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #8fd0ff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a1a2a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4H7M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg></span>
<span style="flex: 1"><h1 id="w-h" style="margin: 0; font-size: 18px; font-weight: 700">Musterstadt</h1><span style="font-size: 12px; color: rgba(255,255,255,0.72)">DWD · Stand 18 Uhr</span></span>
<a href="TUebersicht.dc.html" aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</header>

<!-- Now -->
<div style="display: flex; align-items: center; gap: 14px; padding: 4px 10px">
<span style="font-size: 64px; font-weight: 700; letter-spacing: -0.04em; line-height: 1">9°</span>
<span><span style="display: block; font-size: 18px; font-weight: 600">Regen</span><span style="display: block; font-size: 13px; color: rgba(255,255,255,0.75)">heute 8° – 9° · 3,4 mm</span></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<span style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; border-radius: 16px; background: rgba(255,255,255,0.08); font-size: 12px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.label}}</span>
</sc-for>
</div>

<!-- Warning -->
<div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 8px; border-radius: 28px; background: linear-gradient(90deg, rgba(191,155,255,0.32), rgba(191,155,255,0.08)); border: 1px solid rgba(191,155,255,0.35)">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #bf9bff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d1030" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4M13 12l-3 5h4l-3 5"></path></svg></span>
<span><span style="display: block; font-size: 14px; font-weight: 600">Sonntag stürmisch</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.82)">Böen bis 78 km/h · 24,6 mm Regen</span></span>
</div>

<!-- Hourly -->
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 10px 6px; border-radius: 28px; background: rgba(255,255,255,0.06)">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 11px; color: rgba(255,255,255,0.72)">{{h.t}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4H7M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg>
<span style="font-size: 15px; font-weight: 700">{{h.temp}}°</span>
<span style="font-size: 10px; color: #8fd0ff">{{h.rain}}</span>
</div>
</sc-for>
</div>

<!-- Daily -->
<div style="display: flex; flex-direction: column; border-radius: 28px; background: rgba(255,255,255,0.06); padding: 4px 14px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 30px 24px 46px 1fr 30px; align-items: center; gap: 8px; height: 40px; border-bottom: 1px solid rgba(255,255,255,0.06)">
<span style="font-size: 13px; font-weight: 600">{{d.day}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{d.c}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
<span style="font-size: 11px; color: #8fd0ff">{{d.rain}}</span>
<span style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1)"><span style="{{d.bar}}"></span><span style="{{d.low}}">{{d.min}}°</span></span>
<span style="font-size: 13px; font-weight: 700; text-align: right">{{d.max}}°</span>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; background: rgba(126,232,160,0.12); font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7ee8a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14zM5 19l7-7"></path></svg>
<span><strong>Kein Pollenflug</strong> · alle 8 Pollenarten 0</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rain = 'M7 15a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4H7M8 18l-1 3M12 18l-1 3M16 18l-1 3';
    var cloud = 'M7 18a5 5 0 1 1 3-9 6 6 0 0 1 9 5 4 4 0 0 1-2 4z';
    var lo = 6, hi = 17;
    var day = function (d, min, max, mm, isRain) {
      var l = (min - lo) / (hi - lo) * 100, w = (max - min) / (hi - lo) * 100;
      return { day: d, min: min, max: max, rain: mm > 0 ? String(mm).replace('.', ',') + ' mm' : '', icon: isRain ? rain : cloud, c: isRain ? '#8fd0ff' : 'rgba(255,255,255,0.8)',
        bar: 'position: absolute; top: 0; height: 6px; border-radius: 3px; left: ' + l + '%; width: ' + Math.max(w, 4) + '%; background: linear-gradient(90deg, #8fd0ff, #ffc061)',
        low: 'position: absolute; top: -16px; left: ' + l + '%; font-size: 10px; color: rgba(255,255,255,0.6)' };
    };
    return {
      chips: [
        { label: 'Feuchte 80 %', icon: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z' },
        { label: 'Wind 30 km/h SW', icon: 'M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8' },
        { label: '1012 hPa', icon: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 12l4-3' },
        { label: 'UV 2', icon: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2' },
        { label: 'Sicht 47 km', icon: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6' }
      ],
      hours: [
        { t: '19', temp: 8, rain: '0,1' }, { t: '21', temp: 8, rain: '0,7' }, { t: '23', temp: 9, rain: '1,5' },
        { t: '01', temp: 9, rain: '2,6' }, { t: '03', temp: 9, rain: '2,9' }, { t: '05', temp: 10, rain: '2,7' }
      ],
      days: [
        day('Sa', 8, 9, 3.4, true), day('So', 8, 12, 24.6, true), day('Mo', 8, 12, 1.5, true),
        day('Di', 11, 17, 0, false), day('Mi', 9, 12, 0, false), day('Do', 9, 12, 0, false), day('Fr', 7, 11, 0, false)
      ]
    };
  }
}
</script>
</body>
</html>
