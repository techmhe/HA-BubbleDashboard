<!doctype html>

<title>Energie iPad quer</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101218}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes flow{to{stroke-dashoffset:-28}}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}

<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" aria-label="{{n.name}}" style="{{n.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.c}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg><span style="font-size: 11px; font-weight: 700">{{n.name}}</span></a>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; padding-left: 4px">

</div>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Energie-Dashboard

<text x="90" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">0 W</text>
<text x="90" y="152" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.7)">Sonne</text>
<circle cx="280" cy="90" r="52" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.35)" stroke-width="2"></circle>
<g transform="translate(268 56)" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></g>
<text x="280" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2.440 W</text>
<text x="280" y="124" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)">Haus</text>

<g transform="translate(458 66)" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 6 21M16 3l2 18M7 9h10M6.5 15h11M12 3v18"></path></g>
<text x="470" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2.030 W</text>
<text x="470" y="152" text-anchor="middle" font-size="13" fill="#ffc061">Bezug</text>

<g transform="translate(268 200)" fill="none" stroke="#30d158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h11v10H6zM17 10h2v4h-2M8 10v4M11 10v4"></path></g>

<text x="334" y="218" font-size="13" fill="#9af0b5">Akku 38 %</text>
<text x="334" y="236" font-size="12" fill="rgba(255,255,255,0.6)">entlädt · reicht ~2 h</text>
</svg>
</a>

<span style="position: absolute; left: 4px; top: 0; font-size: 10px; color: rgba(255,255,255,0.5)">3 kW</span>
</div>
<div aria-hidden="true" style="display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,0.6)"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
</section>
</div>

<div style="min-height: 0; display: flex; flex-direction: column; gap: 12px">
<div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{today}}" as="t" hint-placeholder-count="6">
<span style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,0.06)">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.72)"><span style="{{t.dot}}"></span>{{t.label}}</span>
<span style="font-size: 20px; font-weight: 700">{{t.value}}</span>
<span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); position: relative"><span style="{{t.bar}}"></span></span>
</span>
</sc-for>
</div>

<section aria-labelledby="cons-h" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 12px; border-radius: 26px; background: rgba(255,255,255,0.06)">
<div style="display: flex; align-items: center; justify-content: space-between; margin: 0 4px 2px"><h2 id="cons-h" style="margin: 0; font-size: 15px; font-weight: 600">Verbraucher jetzt</h2><span style="font-size: 12px; color: rgba(255,255,255,0.6)">nach Leistung</span></div>
<sc-for list="{{consumers}}" as="c" hint-placeholder-count="7">
<span style="flex: 1; max-height: 72px; min-height: 0; position: relative; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 6px; border-radius: 24px; background: rgba(255,255,255,0.04); overflow: hidden">
<span style="{{c.bar}}"></span>
<span style="position: relative; flex-shrink: 0; width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span>
<span style="position: relative; flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600">{{c.name}}</span><span style="display: block; font-size: 11px; color: rgba(255,255,255,0.6)">{{c.room}}</span></span>
<span style="position: relative; font-size: 14px; font-weight: 700">{{c.value}}</span>
</span>
</sc-for>
</section>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',
      thermo: 'M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z',
      grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',

    };
    var max = 900;
    var cons = function (name, room, w, icon) {
      return { name: name, room: room, value: w.toLocaleString('de-DE') + ' W', icon: icon,
        bar: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + Math.round(w / max * 100) + '%; background: rgba(255,159,10,0.18)' };
    };
    var tile = function (label, value, color, pct) {
      return { label: label, value: value,
        dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + color,
        bar: 'position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; width: ' + pct + '%; background: ' + color };

      return { name: name, icon: icon, href: href, active: active, c: active ? '#101218' : 'rgba(255,255,255,0.8)',

    };

      today: [
        tile('PV erzeugt', '6,4 kWh', '#ffd60a', 42),
        tile('Netzbezug', '9,1 kWh', '#ff9f0a', 59),
        tile('Eingespeist', '1,2 kWh', '#64d2ff', 19),
        tile('Autark', '41 %', '#30d158', 41),
        tile('Eigenverbrauch', '81 %', '#7ee8a0', 81),
        tile('Akku', '38 %', '#9af0b5', 38)
      ],
      consumers: [
        cons('Backofen', 'Küche', 860, I.oven),
        cons('Nicht erfasst', 'ohne eigenen Zähler', 694, I.q),
        cons('Waschmaschine', 'Hauswirtschaftsraum', 412, I.washer),
        cons('Fernseher', 'Wohnzimmer', 138, I.tv),
        cons('Netzwerkschrank', 'Büro Max', 71, I.server),
        cons('Kühlschrank', 'Küche', 64, I.fridge),
        cons('Heimkino', 'Wohnzimmer', 18, I.tv)
      ]
    };
  }
}
</script>
