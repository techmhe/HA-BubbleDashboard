<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Drucker aus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090c}
*{box-sizing:border-box}
.ph{width:390px;height:520px;background:#08090c;color:#fff;font-family:Rubik,system-ui,sans-serif;position:relative;overflow:hidden}
.sheet{position:absolute;left:0;right:0;bottom:0;top:24px;border-radius:42px 42px 0 0;background:#181a22;padding:8px 14px 24px;display:flex;flex-direction:column;gap:10px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.head{display:flex;align-items:center;gap:8px;height:60px;padding:0 6px 0 8px;border-radius:30px;background:rgba(255,255,255,.08)}
.circle{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.close{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);border:none;display:flex;align-items:center;justify-content:center}
.lbl{font-size:12px;color:rgba(255,255,255,.72)}
</style>
</helmet>
<div class="ph">
  <div class="sheet">
    <span class="grab"></span>
    <div class="head">
      <span class="circle" style="width:44px;height:44px;background:rgba(255,255,255,.14)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v4H4zM9 7v4l3 3 3-3V7M6 21h12M8 17h8"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:18px;font-weight:700">3D-Drucker</span><span style="display:block;font-size:12px;color:rgba(255,255,255,.72)">Bambu Lab X2D · aus</span></span>
      <button class="close" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;border-radius:28px;background:rgba(255,255,255,.05);text-align:center">
      <span class="circle" style="width:56px;height:56px;background:rgba(255,255,255,.08)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></span>
      <span style="font-size:16px;font-weight:600">Steckdose aus</span>
      <span class="lbl" style="max-width:260px">Nach dem Einschalten braucht der Drucker etwa 1 min, bis er sich meldet.</span>
      <button style="margin-top:6px;height:44px;padding:0 22px;border-radius:22px;border:none;font-family:inherit;font-size:14px;font-weight:700;background:#30d158;color:#06200e;display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06200e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg>Einschalten</button>
    </div>

    <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-radius:28px;background:rgba(255,255,255,.06)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18"></path></svg>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:13px;font-weight:600">Letzter Druck: Halterung_v3</span><span class="lbl">gestern 21:14 · 4 h 02 min</span></span>
    </div>

    <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-radius:28px;background:rgba(255,255,255,.06)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffc061" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
      <span style="flex:1;font-size:13px;font-weight:600">Diesen Monat</span>
      <span style="font-size:13px;color:rgba(255,255,255,.85)">11,4 kWh · 3,03 €</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
