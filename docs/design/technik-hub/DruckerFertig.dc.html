<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Drucker fertig</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090c}
*{box-sizing:border-box}
.ph{width:390px;height:520px;background:#08090c;color:#fff;font-family:Rubik,system-ui,sans-serif;position:relative;overflow:hidden}
.sheet{position:absolute;left:0;right:0;bottom:0;top:24px;border-radius:42px 42px 0 0;background:#181a22;padding:8px 14px 24px;display:flex;flex-direction:column;gap:10px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.head{display:flex;align-items:center;gap:8px;height:60px;padding:0 6px 0 8px;border-radius:30px;background:rgba(255,255,255,.08)}
.circle{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.close{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);border:none;display:flex;align-items:center;justify-content:center}
.lbl{font-size:12px;color:rgba(255,255,255,.72)}
</style>
</helmet>
<div class="ph">
  <div class="sheet">
    <span class="grab"></span>
    <div class="head">
      <span class="circle" style="width:44px;height:44px;background:#30d158"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06200e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v4H4zM9 7v4l3 3 3-3V7M6 21h12M8 17h8"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:18px;font-weight:700">3D-Drucker</span><span style="display:block;font-size:12px;color:rgba(255,255,255,.72)">Bambu Lab X2D · fertig</span></span>
      <button class="close" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="border-radius:28px;padding:14px;background:linear-gradient(160deg, rgba(48,209,88,.2), rgba(255,255,255,.05) 70%);display:flex;gap:14px;align-items:center">
      <div style="position:relative;width:96px;height:96px;flex-shrink:0">
        <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="42" fill="none" stroke="#30d158" stroke-width="9"></circle></svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <span class="lbl">fertig um</span>
        <span style="font-size:26px;font-weight:700;line-height:1.05">21:14</span>
        <span style="font-size:14px;font-weight:600">Halterung_v3</span>
        <span class="lbl">4 h 02 min · 86 g PLA</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;height:56px;padding:0 8px;border-radius:28px;background:rgba(255,159,10,.12)">
      <span class="circle" style="width:40px;height:40px;background:#ff9f0a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg></span>
      <span style="flex:1"><span style="display:block;font-size:14px;font-weight:600">Druckbett 41°</span><span style="display:block;font-size:12px;color:#ffc061">noch abkühlen lassen · unter 35° entnehmen</span></span>
    </div>

    <div style="display:flex;gap:6px">
      <button style="flex:1;display:flex;align-items:center;gap:10px;height:56px;padding:0 8px;border-radius:28px;border:none;font-family:inherit;color:#fff;text-align:left;background:rgba(255,255,255,.07)">
        <span class="circle" style="width:40px;height:40px;background:rgba(255,255,255,.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg></span>
        <span><span style="display:block;font-size:14px;font-weight:600">Licht</span><span style="display:block;font-size:12px;color:rgba(255,255,255,.72)">aus</span></span>
      </button>
      <button style="flex:1;display:flex;align-items:center;gap:10px;height:56px;padding:0 8px;border-radius:28px;border:none;font-family:inherit;color:#fff;text-align:left;background:rgba(255,255,255,.07)">
        <span class="circle" style="width:40px;height:40px;background:rgba(255,255,255,.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></span>
        <span><span style="display:block;font-size:14px;font-weight:600">Strom</span><span style="display:block;font-size:12px;color:rgba(255,255,255,.72)">ausschalten</span></span>
      </button>
    </div>
    <span class="lbl" style="margin:-4px 8px 0;font-size:11px">Düse ist abgekühlt (32°) · Ausschalten frei · Steckdose 14 W</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
