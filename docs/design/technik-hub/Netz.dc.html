<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Technik Hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090c}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#08090c;color:#fff;font-family:Rubik,system-ui,sans-serif;position:relative;overflow:hidden}
.sheet{position:absolute;left:0;right:0;bottom:0;top:24px;border-radius:42px 42px 0 0;background:#181a22;padding:8px 14px 24px;display:flex;flex-direction:column;gap:10px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.head{display:flex;align-items:center;gap:8px;height:60px;padding:0 6px 0 8px;border-radius:30px;background:rgba(255,255,255,.08)}
.circle{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.close{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);border:none;display:flex;align-items:center;justify-content:center}
.lbl{font-size:12px;color:rgba(255,255,255,.72)}
.card{border-radius:28px;background:rgba(255,255,255,.06);padding:14px}
.pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:20px;background:rgba(255,255,255,.07)}
.pv{font-size:15px;font-weight:700}.pl{font-size:11px;color:rgba(255,255,255,.72)}
.srv{display:flex;align-items:center;gap:10px;height:40px;padding:0 4px}
.sd{width:9px;height:9px;border-radius:5px;flex-shrink:0}
.sn{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:12px;color:rgba(255,255,255,.6)}
.btn{height:44px;border-radius:22px;border:none;font-family:inherit;font-size:14px;font-weight:700}
</style>
</helmet>
<div class="ph">
  <div class="sheet">
    <span class="grab"></span>
    <div class="head">
      <span class="circle" style="width:44px;height:44px;background:#5ac8fa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06141a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:18px;font-weight:700">Technik</span><span style="display:block;font-size:12px;color:#ff8a80">2 Meldungen · 1 Dienst ausgefallen</span></span>
      <button class="close" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;height:60px;padding:0 8px;border-radius:30px;border:1px solid rgba(255,69,58,.4);background:linear-gradient(90deg, rgba(255,69,58,.22), rgba(255,69,58,.05))">
      <span class="circle" style="width:42px;height:42px;background:#ff453a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f0606" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM4 4l16 16"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:700">Werbeblocker aus</span><span class="lbl">Pi-hole · seit gestern 22:05</span></span>
      <button class="btn" style="height:36px;padding:0 14px;font-size:13px;background:#ff453a;color:#1f0606">Einschalten</button>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:2px;padding:12px 14px">
      <span style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="flex:1;font-size:14px;font-weight:600">Dienste</span>
        <span class="lbl">19 von 21 ok · Uptime Kuma</span>
      </span>
      <sc-for list="{{services}}" as="v" hint-placeholder-count="6">
        <div class="srv">
          <span class="sd" style="background:{{v.color}};box-shadow:0 0 0 3px {{v.glow}}"></span>
          <span class="sn">{{v.name}}</span>
          <span class="ss" style="color:{{v.tc}}">{{v.state}}</span>
        </div>
      </sc-for>
      <div class="srv" style="color:rgba(255,255,255,.6)">
        <span class="sd" style="background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.18)"></span>
        <span class="sn" style="font-weight:500;color:rgba(255,255,255,.75)">19 weitere erreichbar</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>


    <div class="card" style="display:flex;gap:14px;align-items:stretch">
      <div aria-label="QR-Code Gäste-WLAN (Platzhalter)" style="flex-shrink:0;padding:8px;border-radius:16px;background:#fff">
        <div style="display:grid;grid-template-columns:repeat(25, 4px);gap:0">
          <sc-for list="{{qr}}" as="c" hint-placeholder-count="625"><span style="width:4px;height:4px;background:{{c}}"></span></sc-for>
        </div>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:15px;font-weight:700">Gäste-WLAN</span>
        <span class="lbl">Guest@Home · Code scannen zum Verbinden</span>
        <span style="display:flex;align-items:center;gap:6px;font-size:13px"><span style="width:8px;height:8px;border-radius:4px;background:#30d158"></span>an · 1 Gerät</span>
        <div style="display:flex;gap:6px;margin-top:auto">
          <button class="btn" style="flex:1;height:36px;font-size:12px;background:rgba(255,255,255,.12);color:#fff">Ausschalten</button>
          <button class="btn" aria-label="Neues Passwort erzeugen" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg></button>
        </div>
      </div>
    </div>

    <a href="DruckerAus.dc.html" style="display:flex;align-items:center;gap:10px;height:56px;padding:0 8px;border-radius:28px;background:rgba(255,255,255,.06);color:#fff;text-decoration:none">
      <span class="circle" style="width:40px;height:40px;background:rgba(255,255,255,.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v4H4zM9 7v4l3 3 3-3V7M6 21h12M8 17h8"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:600">3D-Drucker</span><span class="lbl">aus · letzter Druck gestern</span></span>
      <span class="circle" style="width:40px;height:40px;background:rgba(48,209,88,.18)" aria-label="Einschalten"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7ee8a0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 25;
    const finder = (x, y) => {
      for (const [ox, oy] of [[0, 0], [n - 7, 0], [0, n - 7]]) {
        const dx = x - ox, dy = y - oy;
        if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) {
          const edge = dx === 0 || dy === 0 || dx === 6 || dy === 6;
          const core = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
          return edge || core ? 1 : 0;
        }
        if (dx >= -1 && dx <= 7 && dy >= -1 && dy <= 7) return 0;
      }
      return -1;
    };
    const qr = [];
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const f = finder(x, y);
        const on = f >= 0 ? f === 1 : ((x * 7 + y * 13 + x * y) % 5) < 2;
        qr.push(on ? '#101218' : '#ffffff');
      }
    }
    const services = [
      { name: 'Paperless', state: 'down seit 14 min', color: '#ff453a', glow: 'rgba(255,69,58,.25)', tc: '#ff8a80' },
      { name: 'DNS (lxc-pihole02)', state: 'prüft …', color: '#ffd60a', glow: 'rgba(255,214,10,.2)', tc: '#ffe680' },
      { name: 'Bitwarden', state: 'Zertifikat 6 Tage', color: '#ff9f0a', glow: 'rgba(255,159,10,.2)', tc: '#ffc061' },
    ];
    return { qr, services };
  }
}
</script>
</body>
</html>
