<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Technik alles ok</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090c}
*{box-sizing:border-box}
.ph{width:390px;height:520px;background:#08090c;color:#fff;font-family:Rubik,system-ui,sans-serif;position:relative;overflow:hidden}
.sheet{position:absolute;left:0;right:0;bottom:0;top:24px;border-radius:42px 42px 0 0;background:#181a22;padding:8px 14px 24px;display:flex;flex-direction:column;gap:10px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.head{display:flex;align-items:center;gap:8px;height:60px;padding:0 6px 0 8px;border-radius:30px;background:rgba(255,255,255,.08)}
.circle{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.close{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.12);border:none;display:flex;align-items:center;justify-content:center}
.lbl{font-size:12px;color:rgba(255,255,255,.72)}
.btn{height:40px;border-radius:20px;border:none;font-family:inherit;font-size:13px;font-weight:700}
.pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:20px;background:rgba(255,255,255,.07)}
.pv{font-size:15px;font-weight:700}.pl{font-size:11px;color:rgba(255,255,255,.72)}
</style>
</helmet>
<div class="ph">
  <div class="sheet">
    <span class="grab"></span>
    <div class="head">
      <span class="circle" style="width:44px;height:44px;background:#30d158"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06200e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:18px;font-weight:700">Technik</span><span style="display:block;font-size:12px;color:rgba(255,255,255,.72)">alles in Ordnung</span></span>
      <button class="close" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:28px;background:linear-gradient(90deg, rgba(48,209,88,.18), rgba(255,255,255,.05) 80%)">
      <span style="display:flex;align-items:center;gap:10px">
        <span class="circle" style="width:40px;height:40px;background:#30d158"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06200e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5"></path></svg></span>
        <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">Werbeblocker an</span><span class="lbl">heute 9 % aller Anfragen blockiert</span></span>
      </span>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px">
        <button class="btn" style="background:rgba(255,255,255,.12);color:#fff">5 min pausieren</button>
        <button class="btn" style="background:rgba(255,255,255,.12);color:#fff">1 h pausieren</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:24px;background:rgba(255,214,10,.1)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18"></path></svg>
      <span style="flex:1;font-size:13px">Pausiert noch 3:42 min</span>
      <button class="btn" style="height:32px;padding:0 14px;background:#ffd60a;color:#2b2200">Fortsetzen</button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:24px;background:rgba(255,255,255,.06)">
      <span style="width:9px;height:9px;border-radius:5px;background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.18)"></span>
      <span style="flex:1;font-size:13px;font-weight:600">Dienste · alle 21 erreichbar</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </div>

    <a href="DruckerAus.dc.html" style="display:flex;align-items:center;gap:10px;height:56px;padding:0 8px;border-radius:28px;background:rgba(255,255,255,.06);color:#fff;text-decoration:none">
      <span class="circle" style="width:40px;height:40px;background:rgba(255,255,255,.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v4H4zM9 7v4l3 3 3-3V7M6 21h12M8 17h8"></path></svg></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:600">3D-Drucker</span><span class="lbl">aus · letzter Druck gestern</span></span>
      <span class="circle" style="width:40px;height:40px;background:rgba(48,209,88,.18)" aria-label="Einschalten"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7ee8a0" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
